<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NC Math 2 Adaptive Quiz (Full Curriculum)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }
    .app {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    header h1 { margin: 0; }
    .status-bar {
      display: flex;
      gap: 20px;
      margin: 15px 0;
      flex-wrap: wrap;
    }
    .status-item {
      background: #eee;
      padding: 10px;
      border-radius: 6px;
    }
    .question-card {
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
    }
    .choices { list-style: none; padding: 0; }
    .choice {
      padding: 10px;
      border: 1px solid #ccc;
      margin-bottom: 8px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .choice.correct { background: #d4f8d4; border-color: #2e8b57; }
    .choice.incorrect { background: #ffd6d6; border-color: #b22222; }
    .choice.selected { background: #e6f0ff; border-color: #4a90e2; }
    .hint-box, .explanation-box {
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .hint-box { background: #fff8d6; border: 1px solid #f0d96a; }
    .explanation-box { background: #e6ffff; border: 1px solid #66d9e8; }
    button {
      padding: 8px 15px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      margin-right: 10px;
    }
    .btn-primary { background: #4a90e2; color: white; }
    .btn-muted { background: #ddd; }
    .btn-outline { background: white; border: 1px solid #4a90e2; color: #4a90e2; }
  </style>
</head>

<body>
<div class="app">
  <header>
    <h1>NC Math 2 Adaptive Quiz</h1>
  </header>

  <div class="status-bar">
    <div class="status-item">Questions: <span id="status-question">0 / 5</span></div>
    <div class="status-item">Difficulty: <span id="status-difficulty">Not set</span></div>
    <div class="status-item">Batch Score: <span id="status-batch-score">0 / 0</span></div>
    <div class="status-item">Overall: <span id="status-overall-score">0 / 0</span></div>
  </div>

  <div id="difficulty-select">
    <p>Select starting difficulty:</p>
    <button class="btn-outline" data-diff="hard">Hard</button>
    <button class="btn-outline" data-diff="harder">Harder</button>
    <button class="btn-outline" data-diff="hardest">Hardest</button>
  </div>

  <div id="question-container" style="display:none;">
    <div class="question-card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div><strong>Standard:</strong> <span id="question-standard"></span></div>
          <div><strong>Difficulty:</strong> <span id="question-difficulty" style="text-transform: capitalize;"></span></div>
        </div>
        <div id="feedback"></div>
      </div>

      <h2 id="question-stem" style="line-height: 1.4;"></h2>

      <ul id="choices-list" class="choices"></ul>

      <div id="hint-box" class="hint-box" style="display:none;"></div>
      <div id="explanation-box" class="explanation-box" style="display:none;"></div>

      <div style="margin-top:10px;">
        <button id="btn-submit" class="btn-primary">Submit</button>
        <button id="btn-hint" class="btn-muted">Show Hint</button>
        <button id="btn-next" class="btn-outline" disabled>Next</button>
      </div>
    </div>
  </div>

  <div id="summary-container" style="display:none;margin-top:20px;"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  /* -----------------------------
     PART 1 — QUIZ STATE VARIABLES
  ----------------------------- */

  let currentDifficulty = null;
  let batchQuestionCount = 0;
  const BATCH_SIZE = 5; 

  let batchCorrect = 0;
  let batchTotalAnswered = 0;
  let overallCorrect = 0;
  let overallTotal = 0;
  let currentQuestion = null;
  let currentChoicesLocked = false;

  /* -----------------------------
     PART 2 — EXPANDED NC MATH 2 GENERATOR
  ----------------------------- */

  async function generateMathQuestion(difficulty) {
    return new Promise(resolve => {
      setTimeout(() => {
        let stem, correct, wrong1, wrong2, wrong3, explanation, hint, standardTag;
        
        // Randomly select a topic within the difficulty tier
        let topicSelector = Math.random();

        if (difficulty === "hardest") {
          if (topicSelector < 0.33) {
            // TOPIC: Systems of Equations
            const x = Math.floor(Math.random() * 10) - 5; 
            const y = Math.floor(Math.random() * 10) - 5; 
            const a = Math.floor(Math.random() * 4) + 2; 
            const b = Math.floor(Math.random() * 4) + 2; 
            const c = (a * x) + (b * y); 
            let d, e;
            do {
              d = Math.floor(Math.random() * 4) + 2;
              e = Math.floor(Math.random() * 4) - 5; 
            } while (a * e === b * d); 
            const f = (d * x) + (e * y);
            
            standardTag = "NC.M2.A-REI.7 (Systems of Equations)";
            stem = `Solve the system of equations:<br>1) ${a}x + ${b}y = ${c}<br>2) ${d}x ${e < 0 ? '- ' + Math.abs(e) : '+ ' + e}y = ${f}`;
            correct = `x = ${x}, y = ${y}`;
            wrong1 = `x = ${x + 1}, y = ${y - 1}`;
            wrong2 = `x = ${y}, y = ${x}`;
            wrong3 = `x = ${x - 2}, y = ${y + 2}`;
            if (x === y) wrong2 = `x = ${x + 2}, y = ${y - 2}`;

            hint = "Try using the elimination method or substitution.";
            explanation = `By solving the system, the two lines intersect exactly at x = ${x} and y = ${y}.`;

          } else if (topicSelector < 0.66) {
            // TOPIC: Right Triangle Trigonometry (Geometry)
            const triples = [[3,4,5], [5,12,13], [8,15,17], [7,24,25]];
            const t = triples[Math.floor(Math.random() * triples.length)];
            const isSin = Math.random() < 0.5;
            
            standardTag = "NC.M2.G-SRT.8 (Trigonometry)";
            stem = `In a right triangle, the legs have lengths ${t[0]} and ${t[1]}, and the hypotenuse is ${t[2]}. What is the ${isSin ? 'sine' : 'cosine'} of the angle opposite the side with length ${t[0]}?`;
            correct = isSin ? `${t[0]}/${t[2]}` : `${t[1]}/${t[2]}`;
            wrong1 = isSin ? `${t[1]}/${t[2]}` : `${t[0]}/${t[2]}`;
            wrong2 = `${t[0]}/${t[1]}`;
            wrong3 = `${t[1]}/${t[0]}`;
            hint = "Remember SOH CAH TOA.";
            explanation = isSin ? `Sine is Opposite / Hypotenuse. The opposite side is ${t[0]} and hypotenuse is ${t[2]}.` : `Cosine is Adjacent / Hypotenuse. The adjacent side is ${t[1]} and hypotenuse is ${t[2]}.`;
          
          } else {
            // TOPIC: Quadratic Discriminants
            const a = Math.floor(Math.random() * 3) + 1;
            const b = Math.floor(Math.random() * 6) - 3;
            const c = Math.floor(Math.random() * 5) + 1;
            const disc = (b*b) - (4*a*c);
            let ans, w1, w2, w3;
            
            if (disc > 0) { ans = "2 real solutions"; w1 = "1 real solution"; w2 = "2 complex solutions"; w3 = "0 solutions"; }
            else if (disc === 0) { ans = "1 real solution"; w1 = "2 real solutions"; w2 = "2 complex solutions"; w3 = "Infinite solutions"; }
            else { ans = "2 complex solutions"; w1 = "2 real solutions"; w2 = "1 real solution"; w3 = "0 solutions"; }
            
            standardTag = "NC.M2.A-REI.4 (Quadratic Discriminant)";
            let bStr = b >= 0 ? `+ ${b}` : `- ${Math.abs(b)}`;
            stem = `How many and what type of solutions does the equation ${a}x² ${bStr}x + ${c} = 0 have?`;
            correct = ans; wrong1 = w1; wrong2 = w2; wrong3 = w3;
            hint = "Calculate the discriminant: b² - 4ac";
            explanation = `The discriminant is (${b})² - 4(${a})(${c}) = ${disc}. Because it is ${disc > 0 ? 'positive' : (disc === 0 ? 'zero' : 'negative')}, there are ${ans}.`;
          }

        } else if (difficulty === "harder") {
          if (topicSelector < 0.33) {
            // TOPIC: Factoring Quadratics
            const r1 = Math.floor(Math.random() * 8) - 4; 
            let r2;
            do { r2 = Math.floor(Math.random() * 8) - 4; } while (r1 === r2); 
            
            const B = -(r1 + r2);
            const C = r1 * r2;
            let bStr = B === 0 ? "" : (B === 1 ? "+ x " : (B === -1 ? "- x " : (B > 0 ? `+ ${B}x ` : `- ${Math.abs(B)}x `)));
            let cStr = C === 0 ? "" : (C > 0 ? `+ ${C}` : `- ${Math.abs(C)}`);
            
            standardTag = "NC.M2.A-REI.4 (Factoring Quadratics)";
            stem = `Solve for x: x² ${bStr}${cStr} = 0`;
            correct = `x = ${r1}, x = ${r2}`;
            wrong1 = `x = ${-r1}, x = ${-r2}`;
            wrong2 = `x = ${r1 + 1}, x = ${r2 - 1}`;
            wrong3 = `x = ${r2}, x = ${r2}`; 
            hint = `Find two numbers that multiply to ${C} and add to ${B}.`;
            explanation = `The equation factors perfectly to (x - ${r1})(x - ${r2}) = 0, meaning the roots are ${r1} and ${r2}.`;
            
          } else if (topicSelector < 0.66) {
            // TOPIC: Multiplying Polynomials (FOIL)
            const a = Math.floor(Math.random() * 5) + 1;
            const b = Math.floor(Math.random() * 5) + 1;
            const aSign = Math.random() < 0.5 ? 1 : -1;
            const bSign = Math.random() < 0.5 ? 1 : -1;
            const aVal = a * aSign;
            const bVal = b * bSign;
            const mid = aVal + bVal;
            const last = aVal * bVal;
            
            let midStr = mid === 0 ? "" : (mid > 0 ? `+ ${mid}x ` : `- ${Math.abs(mid)}x `);
            let midStrWrong = mid === 0 ? "" : (mid < 0 ? `+ ${Math.abs(mid)}x ` : `- ${mid}x `);
            let lastStr = last > 0 ? `+ ${last}` : `- ${Math.abs(last)}`;
            let lastStrWrong = last < 0 ? `+ ${Math.abs(last)}` : `- ${last}`;
            
            standardTag = "NC.M2.A-APR.1 (Polynomial Operations)";
            stem = `Expand the expression: (x ${aVal > 0 ? '+' : '-'} ${Math.abs(aVal)})(x ${bVal > 0 ? '+' : '-'} ${Math.abs(bVal)})`;
            correct = `x² ${midStr}${lastStr}`;
            wrong1 = `x² ${midStrWrong}${lastStrWrong}`;
            wrong2 = `x² ${lastStr}`;
            wrong3 = `x² ${midStrWrong}${lastStr}`;
            hint = "Use the FOIL method: Multiply First, Outer, Inner, and Last terms.";
            explanation = `Multiply to get x² + ${bVal}x + ${aVal}x + (${last}), which simplifies to x² ${midStr}${lastStr}.`;
          
          } else {
            // TOPIC: Probability
            const red = Math.floor(Math.random() * 5) + 2;
            const blue = Math.floor(Math.random() * 5) + 2;
            const green = Math.floor(Math.random() * 5) + 2;
            const total = red + blue + green;
            
            standardTag = "NC.M2.S-CP.1 (Probability)";
            stem = `A bag contains ${red} red marbles, ${blue} blue marbles, and ${green} green marbles. If you pick one marble at random, what is the probability it is NOT blue?`;
            correct = `${red + green}/${total}`;
            wrong1 = `${blue}/${total}`;
            wrong2 = `${red}/${total}`;
            wrong3 = `${red + green}/${total - 1}`;
            hint = "Find the total number of marbles, then count how many are NOT blue.";
            explanation = `There are ${total} total marbles. ${red + green} of them are not blue (red and green). The probability is ${red + green}/${total}.`;
          }

        } else {
          if (topicSelector < 0.5) {
            // TOPIC: Multi-step Linear Equations
            const multiplier = Math.floor(Math.random() * 5) + 2; 
            const x = Math.floor(Math.random() * 10) + 1; 
            const b = Math.floor(Math.random() * 20) + 1; 
            const c = (multiplier * x) + b; 
            
            standardTag = "NC.M2.A-CED.1 (Linear Equations)";
            stem = `Solve for x: ${multiplier}x + ${b} = ${c}`;
            correct = `${x}`;
            wrong1 = `${x + 1}`;
            wrong2 = `${x - 2}`;
            wrong3 = `${Math.floor(c / multiplier)}`; 
            hint = `First subtract ${b} from both sides, then divide by ${multiplier}.`;
            explanation = `Subtract ${b} to get ${multiplier}x = ${c - b}. Then divide both sides by ${multiplier} to find x = ${x}.`;
          
          } else {
            // TOPIC: Geometry (Triangle Angles)
            const a = Math.floor(Math.random() * 40) + 30;
            const b = Math.floor(Math.random() * 40) + 30;
            const c = 180 - a - b;
            
            standardTag = "NC.M2.G-CO.10 (Triangle Angles)";
            stem = `Two interior angles of a triangle measure ${a}° and ${b}°. What is the measure of the third angle?`;
            correct = `${c}°`;
            wrong1 = `${c + 10}°`;
            wrong2 = `${180 - a}°`;
            wrong3 = `${90 - Math.min(a,b)}°`;
            hint = "The sum of all interior angles in any triangle is exactly 180°.";
            explanation = `Subtract the known angles from 180: 180° - ${a}° - ${b}° = ${c}°.`;
          }
        }

        // Shuffle the choices
        let choices = [correct, wrong1, wrong2, wrong3].map(String);
        choices = choices.sort(() => Math.random() - 0.5); 
        const answerIndex = choices.indexOf(String(correct));

        const newQuestion = {
          id: "gen_" + Math.floor(Math.random() * 1000000), 
          standardTag: standardTag, 
          difficulty: difficulty,
          stem: stem,
          choices: choices,
          answerIndex: answerIndex,
          hint: hint,
          explanation: explanation
        };
        
        resolve(newQuestion);
      }, 300); 
    });
  }

  /* -----------------------------
     PART 3 — UI RENDERING & LOGIC
  ----------------------------- */

  function renderQuestion(q) {
    currentQuestion = q;
    currentChoicesLocked = false;

    document.getElementById("question-standard").textContent = q.standardTag;
    document.getElementById("question-difficulty").textContent = q.difficulty;
    document.getElementById("question-stem").innerHTML = q.stem;

    const list = document.getElementById("choices-list");
    list.innerHTML = "";

    q.choices.forEach((text, idx) => {
      const li = document.createElement("li");
      li.className = "choice";
      li.dataset.correct = (idx === q.answerIndex) ? "true" : "false";

      const radio = document.createElement("input");
      radio.type = "radio";
      radio.name = "choice";

      li.appendChild(radio);
      li.appendChild(document.createTextNode(text));
      list.appendChild(li);
    });

    document.getElementById("feedback").textContent = "";
    document.getElementById("hint-box").style.display = "none";
    document.getElementById("explanation-box").style.display = "none";

    document.getElementById("btn-next").disabled = true;
  }

  async function loadNextQuestion() {
    if (batchQuestionCount >= BATCH_SIZE) {
      showBatchSummary();
      return;
    }

    updateStatus();
    
    const btnNext = document.getElementById("btn-next");
    btnNext.textContent = "Loading...";

    let q = await generateMathQuestion(currentDifficulty);
    
    batchQuestionCount++;
    renderQuestion(q);
    updateStatus();
    
    btnNext.textContent = "Next";
  }

  function submitAnswer() {
    if (currentChoicesLocked) return;

    const selected = document.querySelector(".choice.selected");
    if (!selected) {
      alert("Select an answer first.");
      return;
    }

    const isCorrect = selected.dataset.correct === "true";

    batchTotalAnswered++;
    overallTotal++;

    if (isCorrect) {
      batchCorrect++;
      overallCorrect++;
    }

    lockChoices(isCorrect);
    updateStatus();
  }

  function lockChoices(isCorrect) {
    currentChoicesLocked = true;
    const selected = document.querySelector(".choice.selected");

    document.querySelectorAll(".choice").forEach(choice => {
      if (choice.dataset.correct === "true") {
        choice.classList.add("correct");
      } else if (selected && choice === selected) {
        choice.classList.add("incorrect");
      }

      choice.querySelector("input").disabled = true;
      choice.classList.remove("selected");
    });

    document.getElementById("feedback").textContent =
      isCorrect ? "Correct!" : "Incorrect.";

    const exp = document.getElementById("explanation-box");
    exp.style.display = "block";
    exp.textContent = "Explanation: " + currentQuestion.explanation;

    document.getElementById("btn-next").disabled = false;
  }

  function showBatchSummary() {
    document.getElementById("question-container").style.display = "none";

    const pct = batchTotalAnswered === 0 ? 0 : Math.round((batchCorrect / batchTotalAnswered) * 100);

    let oldDiff = currentDifficulty;
    
    if (pct >= 80) {
      if (currentDifficulty === "hard") currentDifficulty = "harder";
      else if (currentDifficulty === "harder") currentDifficulty = "hardest";
    } else if (pct < 50) {
      if (currentDifficulty === "hardest") currentDifficulty = "harder";
      else if (currentDifficulty === "harder") currentDifficulty = "hard";
    }

    const summary = `
      <h2>Batch Summary</h2>
      <p>Score: ${batchCorrect} / ${batchTotalAnswered} (${pct}%)</p>
      <p>Previous Difficulty: <span style="text-transform: capitalize;">${oldDiff}</span></p>
      <p>New Difficulty: <span style="text-transform: capitalize;">${currentDifficulty}</span></p>
      <button id="btn-next-batch" class="btn-primary">Next Batch</button>
    `;

    const container = document.getElementById("summary-container");
    container.innerHTML = summary;
    container.style.display = "block";

    document.getElementById("btn-next-batch").onclick = () => {
      batchQuestionCount = 0;
      batchCorrect = 0;
      batchTotalAnswered = 0;

      container.style.display = "none";
      document.getElementById("question-container").style.display = "block";

      loadNextQuestion();
    };
  }

  function updateStatus() {
    document.getElementById("status-question").textContent =
      `${batchQuestionCount} / ${BATCH_SIZE}`;

    document.getElementById("status-difficulty").textContent =
      currentDifficulty || "Not set";

    document.getElementById("status-batch-score").textContent =
      `${batchCorrect} / ${batchTotalAnswered}`;

    document.getElementById("status-overall-score").textContent =
      `${overallCorrect} / ${overallTotal}`;
  }

  /* -----------------------------
     PART 4 — EVENT LISTENERS
  ----------------------------- */

  document.getElementById("difficulty-select").addEventListener("click", e => {
    const diff = e.target.dataset.diff;
    if (!diff) return;

    currentDifficulty = diff;
    document.getElementById("difficulty-select").style.display = "none";
    document.getElementById("question-container").style.display = "block";

    loadNextQuestion();
  });

  document.getElementById("choices-list").addEventListener("click", e => {
    if (currentChoicesLocked) return;

    const li = e.target.closest(".choice");
    if (!li) return;

    document.querySelectorAll(".choice").forEach(c => {
      c.classList.remove("selected");
      c.querySelector("input").checked = false;
    });

    li.classList.add("selected");
    li.querySelector("input").checked = true;
  });

  document.getElementById("btn-submit").onclick = submitAnswer;

  document.getElementById("btn-next").onclick = () => {
    if (!currentChoicesLocked) return;
    loadNextQuestion();
  };

  document.getElementById("btn-hint").onclick = () => {
    const box = document.getElementById("hint-box");
    box.style.display = "block";
    box.textContent = "Hint: " + currentQuestion.hint;
  };
});
</script>
</body>
</html>
